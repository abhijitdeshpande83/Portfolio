{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPilot</title>
    <!-- Favicons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon_io/favicon-16x16.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon_io/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'favicon_io/android-chrome-192x192.png' %}">
    <link rel="icon" type="image/png" sizes="512x512" href="{% static 'favicon_io/android-chrome-512x512.png' %}">
    <link rel="apple-touch-icon" href="{% static 'favicon_io/apple-touch-icon.png' %}">
    <link rel="icon" href="{% static 'favicon_io/favicon.ico' %}">
    <link rel="manifest" href="{% static 'favicon_io/site.webmanifest' %}">    
    <link rel="stylesheet" href="{% static '/css/taskpilot.css' %}">
</head>

<body>

<div class="shell">

    <aside>
        <h1>TaskPilot</h1>
        <!-- <h2>History</h2> -->
    </aside>

    <main>

        <div class="header">
            <h1>Groq Agent</h1>
        </div>

        <div id="chatbox"></div>

        <div class="msg-bubble">
            {% csrf_token %}
            <input id="msg" type="text" placeholder="Ask me anything">
            <button class="btn-btn-img" onclick="sendMessage()">Send</button>
        </div>

    </main>

</div>


<script>

function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]').value;
}

async function sendMessage(){

    const chat = document.getElementById("chatbox")
    const msgInput = document.getElementById("msg")
    const message = msgInput.value.trim()

    if(!message) return

    chat.innerHTML += `
        <div class="usr">
            <img class="usr-img" src="/media/project/user.png"> ${message}
        </div>
    `

    chat.scrollTop = chat.scrollHeight
    console.log(`before Lambda: ${message}`)
    // Invoke Lambda 
    try {const res = await fetch("/projects/agent/", {
        method: "POST",
        mode: "cors",
        headers: {
            "Content-Type":"application/json",
            "X-CSRFToken": getCSRFToken()
        },
        body: JSON.stringify({usr_input:message})
        });
    
    console.log(res.ok)
    const data = await res.json();
    console.log(data);
    chat.innerHTML += `
        <div class="bot">
            <img class="bot-img" src="/media/project/bot.png"> ${data}
        </div>`
    }
    catch(err){
        console.log("Lambda Error: ",err);
        chat.innerHTML += `
        <div class="bot">
            <img class="bot-img" src="/media/project/bot.png"> Error contacting server...
        </div>`
    }
             
    msgInput.value=""

    chat.scrollTop = chat.scrollHeight
}

</script>

</body>
</html>
