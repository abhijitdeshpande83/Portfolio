name: Deploy Django Application
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: build Docker image 
        run: ./automation/docker-build.sh "${{ secrets.DOCKER_USER }}" "${{ secrets.IMG_TAG }}"
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      - name: Print 
        run: echo "Built Docker image successfully"
  
  sync-asstes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Sync assets to EC2
        run: ./automation/sync-assets.sh
        env:
          # EC2_HOST: ${{ secrets.EC2_HOST }}
          KEY: ${{ secrets.EC2_KEY }}
      - name: Confirm asset sync
        run: echo "Static files, media, environment, and deployment configuration successfully synced to EC2."

      
  ec2-cleanup:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Login into EC2
        uses: appleboy/ssh-action@v1.2.2
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Logged into EC2 successfully"
            docker ps -a
            ./docker-clean.sh

  deploy:
    runs-on: ubuntu-latest
    needs: ec2-cleanup
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Deploying to EC2..."
            docker compose --env-file .env up -d
