{% extends 'base.html' %}
{% block title %}Thank You{% endblock %}
{% load static %}

{% block style %}
<link rel="stylesheet" href="{% static '/css/thankyou.css' %}">
{% endblock %}

{% block body %}
<section class="ty-wrap">

    <div class="ty-icon"><i class="bi bi-check-lg"></i></div>

    <div class="ty-actions">
      <a class="btn btn-primary" href="{% url 'index' %}">Back to home</a>

    </div>
  </div>

{% endblock %}
