<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    {% load static %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon_io/favicon-16x16.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon_io/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'favicon_io/android-chrome-192x192.png' %}">
    <link rel="icon" type="image/png" sizes="512x512" href="{% static 'favicon_io/android-chrome-512x512.png' %}">
    <link rel="apple-touch-icon" href="{% static 'favicon_io/apple-touch-icon.png' %}">
    <link rel="icon" href="{% static 'favicon_io/favicon.ico' %}">
    <link rel="manifest" href="{% static 'favicon_io/site.webmanifest' %}">

    <link rel="stylesheet" href="{% static '/css/base.css' %}">
    <link rel="stylesheet" href="{% static '/css/index.css' %}">
    <link rel="stylesheet" href="{% static '/css/skills.css' %}">
    <link rel="stylesheet" href="{% static '/css/experience.css' %}">
    <link rel="stylesheet" href="{% static '/css/projects.css' %}">
    <link rel="stylesheet" href="{% static '/css/contact_me.css' %}">

    {% block style %}{% endblock %}
</head>
<body>
    <header class="nav">
        <div class="nav-inner">
            <a class="nav-brand" href="{% url 'index' %}">
                <img src="{% static 'favicon_io/android-chrome-512x512.png' %}" alt="Home logo">
                <span>The Analytic Mind</span>
            </a>

            <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>

            <nav class="nav-links" id="navLinks">
                <a href="{% url 'intro' %}">Experience</a>
                <a href="{% url 'skills' %}">Skills</a>
                <a href="{% url 'project' %}">Projects</a>
                <a class="nav-cta" href="{% url 'contact_me' %}">Contact me</a>
                <a class="nav-admin" href="{% url 'login' %}"><i class="fas fa-user"></i><span>Admin</span></a>
            </nav>
        </div>
    </header>

    <main>
        {% block body %}{% endblock %}
    </main>

    <script>
        (function () {
            var t = document.querySelector(".nav-toggle");
            var l = document.getElementById("navLinks");
            if (!t || !l) return;
            t.addEventListener("click", function () {
                var open = l.classList.toggle("open");
                t.setAttribute("aria-expanded", open ? "true" : "false");
            });
            l.querySelectorAll("a").forEach(function (a) {
                a.addEventListener("click", function () { l.classList.remove("open"); });
            });
        })();
    </script>
</body>
</html>
